name: scanner
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  mobile_scanner: ^7.1.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - asset/logo/backgroundlogo.png
    - asset/logo/umapadlogo.png
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "asset/logo/backgroundlogo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "asset/logo/backgroundlogo.png"
